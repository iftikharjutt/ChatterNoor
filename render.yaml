databases:
  - name: chatternoor-db
    plan: free
    databaseName: chatternoor
    user: chatternoor

services:
  - type: web
    name: chatternoor-ai
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        fromDatabase:
          name: chatternoor-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: DAILY_USER_LIMIT
        value: 5
      - key: DAILY_GLOBAL_LIMIT
        value: 400
      - key: PGSSL
        value: true
      - key: ALLOWED_ORIGINS
        value: ""
