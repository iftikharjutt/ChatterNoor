name: Build ChatterNoor APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'android/**'
      - '.github/workflows/android-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK tools
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Create debug signing key
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Build APK
        run: |
          sudo apt-get update
          sudo apt-get install -y zip
          chmod +x android/build_apk.sh
          ANDROID_SDK="$ANDROID_HOME" ./android/build_apk.sh

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChatterNoor-debug-apk
          path: ChatterNoor.apk
          if-no-files-found: error
          retention-days: 14
